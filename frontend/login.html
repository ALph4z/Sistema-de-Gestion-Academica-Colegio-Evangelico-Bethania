<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBethania - Acceso Institucional</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">
        <!-- Overlay oscuro sobre la imagen de fondo -->
        <div class="bg-overlay"></div>

        <div class="login-container">
            <!-- Sección Izquierda: Branding Institucional -->
            <div class="brand-section">
                <div class="logo-circle">
                    <!-- Remplazar por la ruta de tu imagen de logo -->
                    <img src="bethania.jpg" alt="Logo Colegio Evangélico Bethania">
                </div>

                <span class="subheading">COLEGIO EVANGÉLICO BETHANIA</span>
                <h1 class="main-title">Educando al niño de hoy, para no castigar el hombre mañana.</h1>
                
                <div class="location-badge">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>San Pedro de Macorís, República Dominicana</span>
                </div>
            </div>

            <!-- Sección Derecha: Tarjeta de Acceso -->
            <div class="card-section">
                <div class="login-card">
                    <div class="card-header">
                        <span class="card-tag">ACCESO INSTITUCIONAL</span>
                    </div>

                    <h2 class="card-title">Bienvenido a EduBethania</h2>

<form class="login-form" action="dashboard.html" method="GET">
    <label for="roleSelect" class="form-label">Selecciona tu perfil de acceso</label>
    <div class="select-wrapper">
        <select id="roleSelect" name="rol" required>
            <option value="Administración" selected>Administración</option>
            <option value="Secretaría">Secretaría</option>
            <option value="Docente">Docente</option>
            <option value="Tutor">Tutor</option>
        </select>
    </div>

    <!-- Mantiene el action en el form pero restaura la clase original de tu CSS -->
    <button type="submit" class="submit-btn">→</button>
</form>
                    <p class="card-footer-text">Acceso demostrativo para la comunidad educativa.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
